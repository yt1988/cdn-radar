# Cloudflare Workers with static assets: `npm run deploy` builds ./public and uploads it with src/worker.js.
# Files are served first (free and not metered); the Worker only sees /geo (where Cloudflare places the visitor),
# shared results (/r/<code>) and unknown paths.
# No routes or custom domain here: on 1ms.dog the site routes the domain to this Worker. To self-host, bind your own
# domain in the dashboard (see README).
name = "cdn-radar"
main = "src/worker.js"
compatibility_date = "2025-10-01"
workers_dev = false
preview_urls = false

[assets]
directory = "./public"
binding = "ASSETS"   # the Worker reads a language's page for shared results (/r/<code>)
